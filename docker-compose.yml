# ghost.js8 — JS8 ops console (current builds are receive-only).
#   cp .env.example .env && docker compose up -d --build
# Or use published multi-arch images (amd64/arm64) instead of building:
#   GHOSTJS8_IMAGE_PREFIX=ghcr.io/d3mocide/ghostjs8 GHOSTJS8_TAG=0.1.0 \
#     docker compose pull && docker compose up -d --no-build
# Put your reverse proxy (NPM / Caddy) in front of the web port; it terminates TLS
# and should handle authentication (see docs/operations.md).
name: ghostjs8

x-build-secrets: &build-secrets
  secrets: [extra_ca]

# No container needs extra privileges: drop every capability and forbid gaining any.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  web:
    <<: *hardened
    image: ${GHOSTJS8_IMAGE_PREFIX:-ghostjs8}-web:${GHOSTJS8_TAG:-local}
    build:
      context: web
      <<: *build-secrets
    ports:
      - "${GHOSTJS8_HTTP_BIND:-127.0.0.1}:${GHOSTJS8_HTTP_PORT:-8080}:8080"
    depends_on:
      bridge: { condition: service_started }
    restart: unless-stopped
    networks: [edge]

  bridge:
    <<: *hardened
    image: ${GHOSTJS8_IMAGE_PREFIX:-ghostjs8}-bridge:${GHOSTJS8_TAG:-local}
    build:
      context: bridge
      <<: *build-secrets
    env_file:
      - path: .env
        required: false
    environment:
      GHOSTJS8_AGENT_URL: ws://decoder:8074/agent
      GHOSTJS8_DB_PATH: /data/ghostjs8.sqlite3
    volumes:
      - bridge-data:/data
    depends_on:
      decoder: { condition: service_started }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, decoder]

  decoder:
    <<: *hardened
    image: ${GHOSTJS8_IMAGE_PREFIX:-ghostjs8}-decoder:${GHOSTJS8_TAG:-local}
    build:
      context: .
      dockerfile: decoder/Dockerfile
      <<: *build-secrets
    restart: unless-stopped  # a FATAL critical process exits 70 and is restarted
    networks: [decoder]       # no egress: JS8Call never reaches the internet

volumes:
  bridge-data:

networks:
  edge: {}
  decoder:
    internal: true

secrets:
  extra_ca:
    file: ${EXTRA_CA:-./tools/acceptance/no-extra-ca.pem}
