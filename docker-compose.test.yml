# Real-recording acceptance test. Run with `make acceptance`.
# Isolated: the network has no egress. The fixture is fetched and verified on
# the host first (tools/fixtures/fetch_fixture.py) and mounted read-only.
name: ghostjs8-acceptance

x-build-secrets: &build-secrets
  secrets: [extra_ca]

# Same hardening as production, so the acceptance test exercises it.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  fake-kiwi:
    <<: *hardened
    image: ghostjs8-bridge:test
    build:
      context: bridge
      <<: *build-secrets
    command: ["python", "-m", "ghostjs8", "fake-kiwi", "--port", "8073",
              "--wav", "/fixtures/A_1_4.wav", "--align", "15", "--repeats", "2"]
    volumes:
      - ./tools/fixtures/cache:/fixtures:ro
    healthcheck: { disable: true }  # image's bridge healthcheck does not apply
    networks: [isolated]

  decoder:
    <<: *hardened
    image: ghostjs8-decoder:test
    build:
      context: .
      dockerfile: decoder/Dockerfile
      <<: *build-secrets
    networks: [isolated]

  bridge:
    <<: *hardened
    image: ghostjs8-bridge:test
    environment:
      GHOSTJS8_AGENT_URL: ws://decoder:8074/agent
      GHOSTJS8_RECEIVER_HOST: fake-kiwi
      GHOSTJS8_RECEIVER_PORT: "8073"
      GHOSTJS8_DIAL_HZ: "14078000"
      GHOSTJS8_LOG_LEVEL: INFO
    depends_on:
      decoder: { condition: service_healthy }
      fake-kiwi: { condition: service_started }
    networks: [isolated]

  acceptance:
    <<: *hardened
    image: ghostjs8-bridge:test
    command: ["python", "-m", "ghostjs8", "acceptance", "--url", "ws://bridge:8073/ws", "--timeout", "150"]
    healthcheck: { disable: true }
    depends_on:
      bridge: { condition: service_started }
    networks: [isolated]

networks:
  isolated:
    internal: true

secrets:
  extra_ca:
    file: ${EXTRA_CA:-./tools/acceptance/no-extra-ca.pem}  # empty unless building behind a TLS proxy
