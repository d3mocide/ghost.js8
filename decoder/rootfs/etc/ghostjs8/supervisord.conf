; Process supervision for the decoder container.
; Any critical program entering FATAL (exhausted restarts) takes the whole
; container down via ghost-fatal-listener, so Docker's restart policy recovers
; it and nothing can look healthy with a dead decoder.

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/ghost/supervisord.pid
nodaemon=true

[unix_http_server]
file=/run/ghost/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/ghost/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
command=/usr/bin/pulseaudio --daemonize=no --exit-idle-time=-1 --disallow-exit --disallow-module-loading=no -n -F /etc/ghostjs8/pulse.pa --log-target=stderr
priority=20
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:js8call]
command=/usr/local/bin/ghost-start-js8call
priority=30
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=/opt/agent/bin/python -m ghostjs8.decoders.js8call_native.agent --port 8074 --udp-port %(ENV_GHOSTJS8_UDP_PORT)s
priority=25
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:fatal]
command=/usr/local/bin/ghost-fatal-listener
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
